name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SECRET_KEY: dev-only-never-used-to-serve-anything-real-0123456789

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Deployment checks pass with DEBUG off
        env:
          DJANGO_DEBUG: "false"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Migrations are up to date with the models
        run: python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Test against SQLite
        run: pytest -q

      - name: Test against PostgreSQL
        env:
          DATABASE_URL: postgres://app:app@localhost:5432/app
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t starter:ci .

      - name: It runs as a non-root user
        # --entrypoint, or entrypoint.sh intercepts the command and tries to
        # migrate against a database that is not there.
        run: test "$(docker run --rm --entrypoint id starter:ci -un)" = "app"

      - name: Static files were collected at build time
        run: |
          docker run --rm --entrypoint sh starter:ci -c \
            "test -f staticfiles/staticfiles.json"

      - name: The stack comes up and reports ready
        run: |
          docker compose -f docker-compose.yml up -d --build
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/ready/ > /dev/null; then
              echo "ready after ${attempt} attempt(s)"
              curl -s http://127.0.0.1:8000/health/ready/
              exit 0
            fi
            sleep 3
          done
          echo "never became ready; logs follow"
          docker compose -f docker-compose.yml logs
          exit 1
        env:
          DJANGO_SECRET_KEY: dev-only-never-used-to-serve-anything-real-0123456789

      - name: The admin renders with the hashed static manifest
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/admin/login/)
          test "$code" = "200" || { echo "admin returned $code"; exit 1; }

      - name: Logs are JSON, one object per line, carrying the request id
        run: |
          # Django only logs a request when it is a 4xx or 5xx, so provoke one.
          request_id="ci-probe-$RANDOM"
          curl -s -o /dev/null -H "X-Request-ID: $request_id" \
            http://127.0.0.1:8000/definitely-not-a-route/
          sleep 2
          docker compose -f docker-compose.yml logs --no-log-prefix web \
            | grep -E '^\{.*"request_id".*\}$' \
            | grep -q "$request_id" \
            || {
              echo "no JSON log line carried the request id"
              docker compose -f docker-compose.yml logs --no-log-prefix web | tail -30
              exit 1
            }

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml down -v || true
